<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>beach-plz 🌊</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ocean:#1B7A8A;--ocean-d:#0F5A6A;--sand:#FAF3E0;--tan-d:#C4A882;--border:#C5DDE3;
  --lacey-l:#E8B8C2;--lacey-d:#A8556A;--nicole-l:#AEE8E0;--nicole-d:#1F7A6F;
  --text:#2C4A52;--muted:#4F7681;
}
html,body{height:100%;font-family:'Nunito',sans-serif;color:var(--text);}
body{
  display:flex;align-items:center;justify-content:center;min-height:100vh;
  background-color:var(--sand);
  background-image:
    radial-gradient(ellipse 500px 320px at 8% 10%, rgba(196,168,130,.35), transparent 60%),
    radial-gradient(ellipse 600px 400px at 95% 30%, rgba(237,224,196,.6), transparent 65%),
    radial-gradient(ellipse 400px 300px at 15% 90%, rgba(232,213,176,.4), transparent 60%),
    radial-gradient(ellipse 500px 350px at 88% 88%, rgba(196,168,130,.25), transparent 65%);
  background-attachment:fixed;
}
.card{
  background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(212,245,234,.65));
  border:1px solid rgba(255,255,255,.7);
  border-radius:26px 30px 22px 28px / 28px 22px 30px 26px;
  box-shadow:0 20px 50px rgba(15,90,106,.2), inset 0 1px 0 rgba(255,255,255,.8);
  backdrop-filter:blur(6px);
  padding:40px 28px 36px;
  max-width:360px;width:100%;margin:20px;text-align:center;
}
.wave{font-size:52px;margin-bottom:8px;display:block}
h1{
  font-family:'Playfair Display',serif;font-size:36px;color:var(--ocean-d);
  margin-bottom:4px;letter-spacing:-.01em;
}
.tagline{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:32px}
.prompt{font-size:14px;color:var(--text);font-weight:700;margin-bottom:16px}
.choices{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.choice{
  position:relative;overflow:hidden;cursor:pointer;
  border:1.5px solid rgba(255,255,255,.7);
  border-radius:16px 12px 18px 13px / 13px 17px 12px 16px;
  padding:18px 20px;font-family:'Nunito';font-weight:800;font-size:17px;color:#fff;
  display:flex;align-items:center;gap:12px;
  box-shadow:0 4px 14px rgba(15,90,106,.2), inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .1s,box-shadow .1s;
}
.choice:active{transform:scale(.98)}
.choice.lacey{background:linear-gradient(150deg,var(--lacey-l),var(--lacey-d))}
.choice.nicole{background:linear-gradient(150deg,var(--nicole-l),var(--nicole-d))}
.choice-sheen{
  position:absolute;top:-12px;left:-12px;width:55%;height:70%;
  background:radial-gradient(ellipse,rgba(255,255,255,.42),transparent 70%);
  pointer-events:none;
}
.choice-initial{
  width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.28);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:900;flex-shrink:0;
}
.choice-text{text-align:left}
.choice-name{font-size:17px;font-weight:800}
.choice-sub{font-size:10px;opacity:.85;font-weight:600;margin-top:1px}
.note{font-size:10px;color:var(--muted);line-height:1.5}

/* Animated wave footer */
.wave-footer{position:fixed;bottom:0;left:0;right:0;height:48px;overflow:hidden;pointer-events:none}
.wave-footer svg{position:absolute;bottom:0;width:200%;animation:waveflow 9s linear infinite}
@keyframes waveflow{from{transform:translateX(0)}to{transform:translateX(-50%)}}
</style>
</head>
<body>

<div class="card">
  <span class="wave">🌊</span>
  <h1>beach-plz</h1>
  <p class="tagline">your trip planner</p>
  <p class="prompt">Who are you?</p>
  <div class="choices">
    <button class="choice lacey" onclick="choose('lacey')">
      <span class="choice-sheen"></span>
      <div class="choice-initial">L</div>
      <div class="choice-text">
        <div class="choice-name">Lacey</div>
        <div class="choice-sub">Go to my map →</div>
      </div>
    </button>
    <button class="choice nicole" onclick="choose('nicole')">
      <span class="choice-sheen"></span>
      <div class="choice-initial">N</div>
      <div class="choice-text">
        <div class="choice-name">Nicole</div>
        <div class="choice-sub">Go to my map →</div>
      </div>
    </button>
  </div>
  <p class="note">🐚 Remembered on this device — no need to choose again next time.</p>
</div>

<div class="wave-footer">
  <svg viewBox="0 0 1440 48" preserveAspectRatio="none" height="48">
    <path d="M0,24 Q180,0 360,24 T720,24 T1080,24 T1440,24 L1440,48 L0,48Z" fill="#1B7A8A" opacity=".22"/>
    <path d="M0,30 Q180,10 360,30 T720,30 T1080,30 T1440,30 L1440,48 L0,48Z" fill="#1B7A8A" opacity=".18"/>
  </svg>
</div>

<script>
const WHO_KEY = 'portA_who';
const ONBOARD_KEY = 'portA_onboarded';

function choose(who) {
  localStorage.setItem(WHO_KEY, who);
  localStorage.setItem(ONBOARD_KEY, 'true');
  window.location.href = who === 'lacey' ? 'lacey_map.html' : 'nicole_map.html';
}

// Auto-redirect if already chose
const saved = localStorage.getItem(WHO_KEY);
if (saved === 'lacey' || saved === 'nicole') {
  window.location.replace(saved === 'lacey' ? 'lacey_map.html' : 'nicole_map.html');
}
</script>
</body>
</html>
