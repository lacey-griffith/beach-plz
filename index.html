<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Port A Trip Planner 🌊</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Nunito:wght@400;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ocean:#1B7A8A;--ocean-d:#0F5A6A;--ocean-l:#3DA5B8;
  --teal:#4ABFB0;--mint-l:#D4F5EA;--sand:#FAF3E0;--sand-d:#EDE0C4;
  --tan:#E8D5B0;--tan-d:#C4A882;--coral:#E8816A;
  --sky-l:#E0F4FA;--text:#2C4A52;--muted:#6B9099;--border:#C5DDE3;--white:#fff;
}
body{font-family:'Nunito',sans-serif;background:var(--sand);color:var(--text);font-size:14px;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}

/* ── HEADER ── */
.hdr{background:linear-gradient(135deg,var(--ocean-d),var(--ocean),var(--ocean-l));color:#fff;padding:10px 14px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hdr h1{font-family:'Playfair Display',serif;font-size:17px;display:flex;align-items:center;gap:6px}
.hdr .sub{font-size:9px;opacity:.75;letter-spacing:.04em;margin-top:1px}
.sync-row{display:flex;align-items:center;gap:5px}
.sdot{width:7px;height:7px;border-radius:50%;background:#7FFFD4}
.sdot.busy{background:#FFD700;animation:pulse 1s infinite}
.sdot.err{background:#FF8A80}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.slbl{font-size:9px;opacity:.85}
.budget-pill{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);border-radius:20px;padding:4px 10px;font-size:11px;font-weight:800;color:#A8FFE8;white-space:nowrap}

/* ── WHO TOGGLE ── */
.who-bar{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--sky-l);border-bottom:1px solid var(--border)}
.who-lbl{font-size:10px;font-weight:700;color:var(--muted)}
.who-btn{font-size:11px;font-weight:800;padding:5px 14px;border-radius:20px;border:2px solid transparent;cursor:pointer;background:var(--white);transition:all .14s}
.who-btn.lacey{border-color:#7B68EE;color:#7B68EE}.who-btn.lacey.on{background:#7B68EE;color:#fff}
.who-btn.nicole{border-color:var(--coral);color:var(--coral)}.who-btn.nicole.on{background:var(--coral);color:#fff}

/* ── DAY TABS ── */
.day-tabs{display:flex;background:var(--white);border-bottom:2px solid var(--border);overflow-x:auto;scrollbar-width:none}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{flex:1;min-width:64px;padding:8px 4px;text-align:center;cursor:pointer;border-bottom:3px solid transparent;transition:all .14s;user-select:none}
.day-tab .dt-name{font-size:11px;font-weight:800;color:var(--muted)}
.day-tab .dt-date{font-size:9px;color:var(--muted);margin-top:1px}
.day-tab .dt-cost{font-size:9px;font-weight:800;color:var(--coral);margin-top:1px}
.day-tab.on{border-bottom-color:var(--teal)}
.day-tab.on .dt-name{color:var(--ocean-d)}

/* ── CALENDAR ── */
.cal-view{flex:1;overflow-y:auto;padding:0}
.time-grid{display:grid;grid-template-columns:48px 1fr}
.tlabel{font-size:9px;font-weight:700;color:var(--muted);text-align:right;padding-right:6px;height:52px;display:flex;align-items:flex-start;padding-top:4px;border-right:1px solid var(--border);background:var(--white)}
.tslot{height:52px;border-bottom:1px solid var(--border);background:var(--sky-l);position:relative;cursor:pointer;transition:background .1s;-webkit-user-select:none;user-select:none}
.tslot:nth-child(odd){background:rgba(184,228,240,.2)}
.tslot.tap-hint{background:var(--mint-l)}

/* ── PLACED ACTIVITY ── */
.pa{position:absolute;left:3px;right:3px;top:2px;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:800;color:#fff;overflow:hidden;z-index:5;display:flex;flex-direction:column;gap:1px;cursor:pointer}
.pa-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pa-meta{font-size:9px;font-weight:600;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pa-rm{position:absolute;top:4px;right:6px;width:18px;height:18px;background:rgba(0,0,0,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px}
.who-ring-lacey{box-shadow:0 0 0 2.5px #7B68EE}
.who-ring-nicole{box-shadow:0 0 0 2.5px var(--coral)}
.who-badge{position:absolute;bottom:3px;right:6px;font-size:8px;opacity:.85;font-weight:800}
.ct-travel{background:linear-gradient(135deg,#D84315,#E64A19)}.ct-pool{background:linear-gradient(135deg,#00838F,#006064)}
.ct-turtle{background:linear-gradient(135deg,#2E7D32,#1B5E20)}.ct-bar{background:linear-gradient(135deg,#BF360C,#D84315)}
.ct-food{background:linear-gradient(135deg,#AD1457,#880E4F)}.ct-nature{background:linear-gradient(135deg,#2E7D32,#388E3C)}
.ct-beach{background:linear-gradient(135deg,#1565C0,#0D47A1)}.ct-drive{background:linear-gradient(135deg,#4527A0,#311B92)}
.ct-other{background:linear-gradient(135deg,#37474F,#263238)}.ct-custom{background:linear-gradient(135deg,#00838F,#0097A7)}
.occ{background:rgba(74,191,176,.12)}

/* ── BOTTOM SHEET ── */
.sheet-overlay{position:fixed;inset:0;background:rgba(27,60,70,.45);z-index:100;opacity:0;pointer-events:none;transition:opacity .22s}
.sheet-overlay.on{opacity:1;pointer-events:all}
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-radius:18px 18px 0 0;z-index:101;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);max-height:82vh;display:flex;flex-direction:column}
.sheet.on{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 0}
.sheet-hdr{padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.sheet-hdr h3{font-family:'Playfair Display',serif;font-size:16px;color:var(--ocean-d)}
.sheet-hdr .sh-close{width:28px;height:28px;border-radius:50%;background:var(--sand-d);border:none;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.ftabs{display:flex;gap:4px;padding:8px 12px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border)}
.ftabs::-webkit-scrollbar{display:none}
.ftab{font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;cursor:pointer;border:1.5px solid var(--border);background:var(--white);color:var(--muted);white-space:nowrap;transition:all .12s;flex-shrink:0}
.ftab.on,.ftab:hover{background:var(--teal);color:#fff;border-color:var(--teal)}
.sheet-body{overflow-y:auto;padding:10px 12px 24px;flex:1}
.add-custom-row{padding:0 0 8px}
.add-btn{width:100%;padding:10px;border-radius:10px;border:2px dashed var(--teal);background:var(--mint-l);color:var(--ocean-d);font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;cursor:pointer;transition:all .14s}
.add-btn:active{background:var(--teal);color:#fff}

/* ── ACTIVITY CARDS IN SHEET ── */
.ac{background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:7px;cursor:pointer;transition:all .13s;position:relative;border-left:4px solid var(--teal);display:flex;align-items:center;gap:10px}
.ac:active{background:var(--mint-l);transform:scale(.98)}
.ac.used{opacity:.35;pointer-events:none}
.ac.custom-card{border-left-color:var(--coral)}
.ac-left{flex:1;min-width:0}
.ac-name{font-weight:700;font-size:12.5px;margin-bottom:3px;display:flex;align-items:center;gap:5px}
.ac-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.ac-closed{font-size:9.5px;color:var(--coral);font-weight:700;margin-top:3px}
.ac-add{width:32px;height:32px;border-radius:50%;background:var(--teal);color:#fff;border:none;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .12s}
.ac-add:active{background:var(--ocean)}
.ac-del{width:26px;height:26px;border-radius:50%;background:var(--sand-d);color:var(--muted);border:none;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.ac-del:active{background:var(--coral);color:#fff}
.pill{font-size:9px;font-weight:700;padding:2px 6px;border-radius:20px;text-transform:uppercase;white-space:nowrap}
.pf{background:var(--mint-l);color:#1A6B4A}.pc{background:#FFF3E0;color:#C55A00}.pt{background:var(--sky-l);color:var(--ocean-d)}

/* ── FAB (floating action button) ── */
.fab{position:fixed;bottom:24px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--teal);color:#fff;border:none;font-size:26px;cursor:pointer;box-shadow:0 4px 16px rgba(27,122,138,.35);z-index:50;display:flex;align-items:center;justify-content:center;transition:all .14s}
.fab:active{background:var(--ocean);transform:scale(.94)}

/* ── TIME PICKER MODAL ── */
.tpicker{position:fixed;inset:0;background:rgba(27,60,70,.55);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.tpicker-card{background:var(--white);border-radius:18px 18px 0 0;width:100%;max-width:480px;padding:20px 20px 32px}
.tpicker-card h4{font-family:'Playfair Display',serif;font-size:16px;color:var(--ocean-d);margin-bottom:4px}
.tpicker-card .tp-sub{font-size:11px;color:var(--muted);margin-bottom:14px}
.tp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:260px;overflow-y:auto}
.tp-slot{padding:10px 4px;border-radius:8px;border:1.5px solid var(--border);background:var(--sky-l);text-align:center;cursor:pointer;font-size:11px;font-weight:700;color:var(--text);transition:all .12s}
.tp-slot:active{background:var(--teal);color:#fff;border-color:var(--teal)}
.tp-slot.taken{background:var(--sand-d);color:var(--muted);pointer-events:none;opacity:.5}
.tp-slot.selected{background:var(--teal);color:#fff;border-color:var(--teal)}
.tp-cancel{width:100%;margin-top:12px;padding:12px;border-radius:10px;border:none;background:var(--sand-d);color:var(--muted);font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer}

/* ── CUSTOM ACTIVITY MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(27,60,70,.55);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.modal-card{background:var(--white);border-radius:18px 18px 0 0;width:100%;max-width:480px;padding:20px 18px 32px;max-height:88vh;overflow-y:auto}
.modal-card h3{font-family:'Playfair Display',serif;font-size:17px;color:var(--ocean-d);margin-bottom:14px;display:flex;align-items:center;gap:7px}
.mfield{margin-bottom:11px}
.mfield label{display:block;font-size:10px;font-weight:800;color:var(--ocean);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.mfield input,.mfield select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-family:'Nunito',sans-serif;font-size:14px;color:var(--text);background:var(--sand);outline:none;-webkit-appearance:none}
.mfield input:focus,.mfield select:focus{border-color:var(--teal)}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbtn-row{display:flex;gap:8px;margin-top:14px}
.mbtn{flex:1;padding:12px;border-radius:10px;border:none;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;transition:all .14s}
.mbtn-cancel{background:var(--sand-d);color:var(--muted)}
.mbtn-add{background:var(--teal);color:#fff}
.mbtn-add:active{background:var(--ocean)}

/* ── TOAST ── */
.toast-c{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:5px;pointer-events:none;width:90%;max-width:340px}
.toast{padding:10px 16px;border-radius:10px;font-size:12px;font-weight:700;color:#fff;animation:tsin .18s ease;text-align:center;font-family:'Nunito',sans-serif}
@keyframes tsin{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
.tw{background:var(--coral)}.te{background:#C0392B}.ts{background:var(--teal)}

/* ── BEACH FOOTER ── */
.beach-footer{height:52px;position:relative;overflow:hidden;background:var(--tan);flex-shrink:0}

.countdown-bar{background:linear-gradient(135deg,var(--ocean-d),var(--teal));color:#fff;text-align:center;padding:7px 14px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.cd-label{font-size:10px;opacity:.8;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.cd-units{display:flex;gap:8px;align-items:center}
.cd-unit{display:flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.15);border-radius:8px;padding:4px 8px;min-width:44px}
.cd-num{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;line-height:1;color:#A8FFE8}
.cd-sub{font-size:8px;opacity:.75;text-transform:uppercase;letter-spacing:.06em;margin-top:1px}
.cd-sep{font-size:16px;opacity:.5;font-weight:700;padding-bottom:8px}
.cd-done{font-family:'Playfair Display',serif;font-size:16px;color:#A8FFE8;font-style:italic}

.beach-footer .sbg{position:absolute;inset:0;background:linear-gradient(to bottom,var(--sand-d),var(--tan),var(--tan-d))}
.beach-footer svg{position:absolute;bottom:0;left:0;width:100%;height:52px}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div>
    <h1>🌊 Port A Planner</h1>
    <div class="sub">July 22–26, 2026 · Nicole · RJ · Tyler · Gracie · Lacey</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
    <div class="sync-row"><div class="sdot" id="sdot"></div><span class="slbl" id="slbl">Connecting...</span></div>
    <div class="budget-pill">💰 <span id="totalCost">$0</span>/person</div>
  </div>
</div>

<!-- WHO -->
<div class="who-bar">
  <span class="who-lbl">I am:</span>
  <button class="who-btn lacey on" id="btnL" onclick="setWho('lacey')">Lacey 💜</button>
  <button class="who-btn nicole" id="btnN" onclick="setWho('nicole')">Nicole 🧡</button>
</div>


<!-- COUNTDOWN -->
<div class="countdown-bar" id="countdownBar">
  <span class="cd-label">⏳ Port A in</span>
  <div class="cd-units" id="cdUnits">
    <div class="cd-unit"><span class="cd-num" id="cdDays">--</span><span class="cd-sub">days</span></div>
    <span class="cd-sep">:</span>
    <div class="cd-unit"><span class="cd-num" id="cdHrs">--</span><span class="cd-sub">hrs</span></div>
    <span class="cd-sep">:</span>
    <div class="cd-unit"><span class="cd-num" id="cdMins">--</span><span class="cd-sub">min</span></div>
    <span class="cd-sep">:</span>
    <div class="cd-unit"><span class="cd-num" id="cdSecs">--</span><span class="cd-sub">sec</span></div>
  </div>
</div>

<!-- DAY TABS -->
<div class="day-tabs" id="dayTabs"></div>

<!-- CALENDAR VIEW -->
<div class="cal-view" id="calView"></div>

<!-- BEACH FOOTER -->
<div class="beach-footer">
  <div class="sbg"></div>
  <svg viewBox="0 0 400 52" preserveAspectRatio="none">
    <ellipse cx="40" cy="46" rx="28" ry="5" fill="rgba(196,168,130,.4)"/>
    <ellipse cx="130" cy="48" rx="20" ry="4" fill="rgba(196,168,130,.3)"/>
    <ellipse cx="230" cy="47" rx="24" ry="4" fill="rgba(196,168,130,.35)"/>
    <ellipse cx="340" cy="47" rx="22" ry="4" fill="rgba(196,168,130,.3)"/>
    <g transform="translate(28,36)"><ellipse cx="0" cy="0" rx="8" ry="5" fill="#E8C99A" stroke="#D4A877" stroke-width=".7"/><path d="M-8,0 Q0,-4 8,0" stroke="#C49A6C" stroke-width=".5" fill="none"/><path d="M-7,1.5 Q0,-2 7,1.5" stroke="#C49A6C" stroke-width=".4" fill="none"/><line x1="-2" y1="-5" x2="-3" y2="-8" stroke="#D4A877" stroke-width=".6"/></g>
    <g transform="translate(90,42)"><ellipse cx="0" cy="0" rx="5" ry="5" fill="#F0D9B5" stroke="#D4B896" stroke-width=".6"/><ellipse cx="0" cy="0" rx="3" ry="3" fill="none" stroke="#C4A070" stroke-width=".4"/><ellipse cx="0" cy="0" rx="1.5" ry="1.5" fill="#C4A070"/></g>
    <g transform="translate(160,40)"><path d="M0,-7 Q7,1 2,7 Q0,8 -2,7 Q-7,1 0,-7Z" fill="#E8C99A" stroke="#C4A070" stroke-width=".6"/><path d="M0,-7 Q3,-1 2,4" stroke="#C4A070" stroke-width=".4" fill="none"/><path d="M0,-7 Q-3,-1 -2,4" stroke="#C4A070" stroke-width=".4" fill="none"/></g>
    <g transform="translate(230,38)"><ellipse cx="0" cy="0" rx="9" ry="5" fill="#FADADD" stroke="#E4A0A8" stroke-width=".7"/><path d="M-9,0 Q0,-4 9,0" stroke="#C48090" stroke-width=".5" fill="none"/><path d="M-7,1.5 Q0,-2 7,1.5" stroke="#C48090" stroke-width=".4" fill="none"/><line x1="-2" y1="-5" x2="-2.5" y2="-9" stroke="#D4909A" stroke-width=".6"/></g>
    <g transform="translate(295,42)"><ellipse cx="0" cy="0" rx="5" ry="5" fill="#C5E8F0" stroke="#88C8D8" stroke-width=".6"/><ellipse cx="0" cy="0" rx="3" ry="3" fill="none" stroke="#68A8B8" stroke-width=".4"/><ellipse cx="0" cy="0" rx="1.2" ry="1.2" fill="#88C8D8"/></g>
    <g transform="translate(360,39)"><ellipse cx="0" cy="0" rx="8" ry="5" fill="#FFE0B2" stroke="#E4A060" stroke-width=".6"/><path d="M-8,0 Q0,-4 8,0" stroke="#D49050" stroke-width=".5" fill="none"/><line x1="1" y1="-5" x2="2" y2="-8" stroke="#D4A060" stroke-width=".5"/></g>
    <path d="M5,50 Q30,48 55,50 Q80,48 105,50" stroke="rgba(196,168,130,.5)" stroke-width=".7" fill="none"/>
    <path d="M200,50 Q240,48 280,50" stroke="rgba(196,168,130,.4)" stroke-width=".6" fill="none"/>
  </svg>
</div>

<!-- FAB: open activity sheet -->
<button class="fab" id="fab" onclick="openSheet()" title="Add activity">＋</button>

<!-- BOTTOM SHEET: activity picker -->
<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-hdr">
    <h3>🐚 Add to <span id="sheetDayName">Wed</span></h3>
    <button class="sh-close" onclick="closeSheet()">✕</button>
  </div>
  <div class="ftabs" id="ftabs">
    <div class="ftab on" data-f="all">All</div>
    <div class="ftab" data-f="custom">✦ Custom</div>
    <div class="ftab" data-f="travel">🚙 Travel</div>
    <div class="ftab" data-f="pool">🏊 Pool</div>
    <div class="ftab" data-f="turtle">🐢 Turtle</div>
    <div class="ftab" data-f="bar">🍺 Bar</div>
    <div class="ftab" data-f="food">🍕 Food</div>
    <div class="ftab" data-f="nature">🌿 Free</div>
  </div>
  <div class="sheet-body">
    <div class="add-custom-row">
      <button class="add-btn" onclick="closeSheet();openModal()">✦ Add custom activity</button>
    </div>
    <div id="acList"></div>
  </div>
</div>

<!-- TIME PICKER -->
<div class="tpicker" id="tpicker" style="display:none">
  <div class="tpicker-card">
    <h4 id="tp-title">Pick a start time</h4>
    <div class="tp-sub" id="tp-sub"></div>
    <div class="tp-grid" id="tp-grid"></div>
    <button class="tp-cancel" onclick="closeTpicker()">Cancel</button>
  </div>
</div>

<!-- CUSTOM ACTIVITY MODAL -->
<div class="modal-overlay" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal-card">
    <h3>🐚 Add Custom Activity</h3>
    <div class="mfield"><label>Name *</label><input id="m-name" placeholder="e.g. Get coffee at sunrise" maxlength="50"/></div>
    <div class="mrow">
      <div class="mfield"><label>Emoji</label><input id="m-emoji" placeholder="☕" maxlength="2" style="font-size:20px;text-align:center"/></div>
      <div class="mfield"><label>Duration</label><select id="m-dur"><option value="1">30 min</option><option value="2" selected>1 hour</option><option value="3">1.5 hrs</option><option value="4">2 hours</option><option value="6">3 hours</option><option value="8">4 hours</option></select></div>
    </div>
    <div class="mrow">
      <div class="mfield"><label>Cost / person</label><input id="m-cost" type="number" placeholder="0" min="0" max="999"/></div>
      <div class="mfield"><label>Closed day</label><select id="m-closed"><option value="">Open all days</option><option value="wed">Wed</option><option value="thu">Thu</option><option value="fri">Fri</option><option value="sat">Sat</option><option value="sun">Sun</option></select></div>
    </div>
    <div class="mfield"><label>Note (optional)</label><input id="m-note" placeholder="e.g. On the beach near condo" maxlength="80"/></div>
    <div class="mbtn-row">
      <button class="mbtn mbtn-cancel" onclick="closeModal()">Cancel</button>
      <button class="mbtn mbtn-add" onclick="submitCustom()">✦ Add</button>
    </div>
  </div>
</div>

<div class="toast-c" id="toastC"></div>

<script>
const API_KEY='$2a$10$fB8HdKHZXxwyK6Qj087K3OdEXwetiR4n4BeQaWd9prgKSfVY2kp2u';
const BIN_ID='6a401210da38895dfe08580f';
const JSONBIN_BASE='https://api.jsonbin.io/v3';

const DAYS=[{id:'wed',name:'Wed',date:'Jul 22',label:'Arrival'},{id:'thu',name:'Thu',date:'Jul 23',label:'Day 2'},{id:'fri',name:'Fri',date:'Jul 24',label:'Day 3'},{id:'sat',name:'Sat',date:'Jul 25',label:'Day 4'},{id:'sun',name:'Sun',date:'Jul 26',label:'Checkout'}];

const BASE_ACTS=[
  {id:'drive-there',e:'🚙',name:'Drive to Port A',type:'travel',dur:9,cost:0,cl:[],n:'Leave early! Allow 4.5–5 hrs with stops.'},
  {id:'drive-home',e:'🏡',name:'Drive Home',type:'travel',dur:9,cost:0,cl:[],n:'Check out 11am, home before dark.'},
  {id:'checkin',e:'🏠',name:'Check In',type:'other',dur:2,cost:0,cl:[],n:'Unpack, claim beds.'},
  {id:'grocery',e:'🛒',name:'Grocery Run',type:'other',dur:2,cost:40,cl:[],n:'Stock up before island. Huge savings for 5!'},
  {id:'pool-am',e:'🏊',name:'Pool (Morning)',type:'pool',dur:4,cost:0,cl:[],n:'Before heat peaks. Coffee + pool = perfect.'},
  {id:'pool-pm',e:'🏊',name:'Pool (Afternoon)',type:'pool',dur:4,cost:0,cl:[],n:'Peak pool hours. Floaties, cold drinks.'},
  {id:'pool-eve',e:'🌅',name:'Pool at Sunset',type:'pool',dur:3,cost:0,cl:[],n:'Swim while the sky turns pink.'},
  {id:'sunrise',e:'🌅',name:'Sunrise Walk',type:'beach',dur:2,cost:0,cl:[],n:'Best shelling, dolphins offshore.'},
  {id:'beach',e:'🏖️',name:'Beach Day',type:'beach',dur:6,cost:0,cl:[],n:'Sun, sand, Gulf vibes.'},
  {id:'nightwalk',e:'🌙',name:'Night Beach Walk',type:'beach',dur:2,cost:0,cl:[],n:'Watch for turtle tracks. Red light only near nests.'},
  {id:'pier',e:'🎣',name:'Horace Caldwell Pier',type:'beach',dur:3,cost:3,cl:[],n:'Pole rentals on site. Catch pompano, tarpon, shark.'},
  {id:'ark',e:'🐢',name:'ARK Turtle Rehab',type:'turtle',dur:2,cost:0,cl:['thu','sat','sun'],n:'PRE-REGISTER: utmsi.utexas.edu · Wed & Fri 10am only'},
  {id:'sealife',e:'🐢',name:'Texas Sealife Center',type:'turtle',dur:3,cost:9,cl:['wed'],n:'$9/person · Thu–Sat 10–4 · Sun 12–4 · ~35 min drive'},
  {id:'jetty',e:'🪨',name:'South Jetty',type:'turtle',dur:2,cost:0,cl:[],n:'Walk granite rocks — turtles year-round.'},
  {id:'utmsi',e:'🔬',name:'UT Marine Science',type:'nature',dur:2,cost:0,cl:['wed','sun'],n:'Free · Tue–Sat 10–4 · Seahorses, eels, whale jawbone.'},
  {id:'birding',e:'🐦',name:'Leonabelle Birding',type:'nature',dur:2,cost:0,cl:[],n:'Free · Loaner binoculars · Sunrise to sunset'},
  {id:'roberts',e:'⛵',name:'Roberts Point Park',type:'nature',dur:2,cost:0,cl:[],n:'Ships, dolphins, best sunset. Free.'},
  {id:'ferry',e:'⛴️',name:'Ferry Ride',type:'nature',dur:1,cost:0,cl:[],n:'Free! Dolphins ride the wake. Build in line time.'},
  {id:'golfcart',e:'🛺',name:'Golf Cart Rental',type:'other',dur:4,cost:25,cl:[],n:'Book Coastal Ed\'s in advance — sells out!'},
  {id:'gaff',e:'🏴‍☠️',name:'The Gaff',type:'bar',dur:3,cost:20,cl:[],n:'Pirate dive bar, cheap pizza, belt sander races!'},
  {id:'beerHut',e:'🍺',name:'Port A Beer Hut',type:'bar',dur:2,cost:20,cl:['wed','thu'],n:'CASH ONLY · Swing bar! Live music Saturdays.'},
  {id:'stingrays',e:'🚗',name:"Stingray's Taphouse",type:'bar',dur:3,cost:25,cl:['thu','fri'],n:'Real Mustangs over the bar. 20+ taps, pizza & wings.'},
  {id:'bierhaus',e:'🍻',name:'BierHaus',type:'bar',dur:3,cost:25,cl:[],n:'Bar swings, live music, great burgers.'},
  {id:'nueces',e:'🔥',name:'Nueces Brewing + BBQ',type:'drive',dur:4,cost:35,cl:['wed','sun'],n:'~35 min drive · Award-winning BBQ + craft beer'},
  {id:'moby',e:'🐳',name:"Moby Dick's",type:'food',dur:4,cost:30,cl:['wed','sun'],n:'Seafood, steaks, Tiki bar · Tue–Sat 11–9'},
  {id:'burgers',e:'🍔',name:'Burgers (Condo)',type:'food',dur:2,cost:10,cl:[],n:'Grill out! Budget win for 5 people.'},
  {id:'tacos',e:'🌮',name:'Tacos (Condo/Takeout)',type:'food',dur:2,cost:12,cl:[],n:'Condo taco bar or local takeout.'},
  {id:'sandwiches',e:'🥖',name:'Sandwich Lunch',type:'food',dur:1,cost:5,cl:[],n:'Quick & cheap. Keeps everyone fueled.'},
  {id:'proteinbowls',e:'🥗',name:'Protein Bowls (Condo)',type:'food',dur:2,cost:12,cl:[],n:'Rice, chicken/shrimp, veggies. Macro-friendly!'},
  {id:'seafood',e:'🦐',name:'Local Seafood Takeout',type:'food',dur:2,cost:20,cl:[],n:'Fried shrimp, fish tacos, boiled seafood.'},
  {id:'downtown',e:'🎨',name:'Explore Downtown Port A',type:'other',dur:2,cost:0,cl:[],n:'Art galleries, boutique shops, souvenirs.'},
];

const REUSABLE=['pool','food','travel','custom'];
const H_START=6,H_END=24,TOTAL=(H_END-H_START)*2;

let placed={};DAYS.forEach(d=>{placed[d.id]={}});
let customActs=[];
let curDay='wed';
let curFilter='all';
let currentWho='lacey';
let pendingAct=null; // activity waiting for time slot selection
let pollTimer=null,lastEtag=null;

function allActs(){return[...BASE_ACTS,...customActs];}
function getA(id){return allActs().find(a=>a.id===id);}
function isClosed(aid,did){const a=getA(aid);return a&&a.cl&&a.cl.includes(did);}
function isConflict(did,s,span){for(let i=s;i<s+span;i++) if(placed[did][i]) return true;return false;}
function isUsed(aid){const a=getA(aid);if(REUSABLE.includes(a?.type)) return false;return DAYS.some(d=>Object.values(placed[d.id]).some(p=>p?.isStart&&p.actId===aid));}
function totalCost(){let t=0;DAYS.forEach(d=>Object.values(placed[d.id]).forEach(p=>{if(p?.isStart){const a=getA(p.actId);if(a)t+=a.cost;}}));return t;}
function dayCost(did){let t=0;Object.values(placed[did]).forEach(p=>{if(p?.isStart){const a=getA(p.actId);if(a)t+=a.cost;}});return t;}
function t2s(slot){const m=(H_START*60)+(slot*30),h=Math.floor(m/60),min=m%60,ap=h<12?'am':'pm',h12=h===0?12:h>12?h-12:h;return`${h12}:${min.toString().padStart(2,'0')}${ap}`;}

// ── SYNC ──────────────────────────────────────
function setSS(s,msg){
  const d=document.getElementById('sdot'),l=document.getElementById('slbl');
  d.className='sdot';
  if(s==='busy'){d.classList.add('busy');l.textContent=msg||'Saving...';}
  else if(s==='ok'){l.textContent=msg||'Live · synced';}
  else{d.classList.add('err');l.textContent='Sync error';}
}

async function saveToBin(){
  setSS('busy');
  try{
    const r=await fetch(`${JSONBIN_BASE}/b/${BIN_ID}`,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':API_KEY},body:JSON.stringify({placed,customActs})});
    if(r.ok) setSS('ok'); else setSS('err');
  }catch(e){setSS('err');}
}

async function loadFromBin(){
  try{
    const r=await fetch(`${JSONBIN_BASE}/b/${BIN_ID}/latest`,{headers:{'X-Master-Key':API_KEY}});
    if(!r.ok) return;
    const etag=r.headers.get('ETag');
    if(etag&&etag===lastEtag) return;
    lastEtag=etag;
    const json=await r.json();
    const data=json.record;
    if(data.placed){placed={};DAYS.forEach(d=>{placed[d.id]=data.placed[d.id]||{};});}
    if(data.customActs) customActs=data.customActs;
    renderAll();setSS('ok');
  }catch(e){}
}

function startPolling(){if(pollTimer) clearInterval(pollTimer);pollTimer=setInterval(loadFromBin,4000);}

// ── WHO ───────────────────────────────────────
function setWho(w){
  currentWho=w;
  document.getElementById('btnL').className='who-btn lacey'+(w==='lacey'?' on':'');
  document.getElementById('btnN').className='who-btn nicole'+(w==='nicole'?' on':'');
}

// ── TOAST ─────────────────────────────────────
function toast(msg,cls='ts',dur=2200){
  const c=document.getElementById('toastC'),t=document.createElement('div');
  t.className=`toast ${cls}`;t.textContent=msg;c.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .22s';setTimeout(()=>t.remove(),240);},dur);
}

// ── DAY TABS ──────────────────────────────────
function renderDayTabs(){
  const tabs=document.getElementById('dayTabs');
  tabs.innerHTML='';
  DAYS.forEach(d=>{
    const t=document.createElement('div');
    t.className='day-tab'+(d.id===curDay?' on':'');
    const dc=dayCost(d.id);
    t.innerHTML=`<div class="dt-name">${d.name}</div><div class="dt-date">${d.date}</div>${dc>0?`<div class="dt-cost">$${dc}/p</div>`:''}`;
    t.onclick=()=>{curDay=d.id;renderAll();};
    tabs.appendChild(t);
  });
}

// ── CALENDAR ──────────────────────────────────
function renderCalendar(){
  const view=document.getElementById('calView');
  view.innerHTML='';
  const grid=document.createElement('div');
  grid.className='time-grid';

  for(let s=0;s<TOTAL;s++){
    const lbl=document.createElement('div');
    lbl.className='tlabel';
    if(s%2===0) lbl.textContent=t2s(s);
    grid.appendChild(lbl);

    const cell=document.createElement('div');
    cell.className='tslot';
    cell.dataset.s=s;

    const entry=placed[curDay][s];
    if(entry?.isStart){
      const a=getA(entry.actId);
      if(a){
        const pa=document.createElement('div');
        pa.className=`pa ct-${a.isCustom?'custom':a.type} who-ring-${entry.who||'lacey'}`;
        pa.style.height=`${entry.span*52-4}px`;
        pa.innerHTML=`<div class="pa-name">${a.e} ${a.name}</div><div class="pa-meta">${t2s(s)} · ${a.cost===0?'Free':'$'+a.cost+'/p'} · ~${a.dur*30}min</div><div class="pa-rm">✕</div><div class="who-badge">${entry.who==='nicole'?'N':'L'}</div>`;
        pa.querySelector('.pa-rm').addEventListener('click',e=>{
          e.stopPropagation();
          removeAct(curDay,s,entry.actId,entry.span);
        });
        cell.appendChild(pa);
      }
    } else if(entry&&!entry.isStart){
      cell.classList.add('occ');
    } else {
      // Empty slot — tap to place if we have a pending activity
      cell.addEventListener('click',()=>{
        if(pendingAct) placeAct(curDay,s,pendingAct);
      });
    }

    grid.appendChild(cell);
  }

  view.appendChild(grid);
  document.getElementById('totalCost').textContent='$'+totalCost();
}

function renderAll(){renderDayTabs();renderCalendar();renderSidebar();}

// ── SHEET ─────────────────────────────────────
function openSheet(){
  document.getElementById('sheetDayName').textContent=DAYS.find(d=>d.id===curDay)?.name||'';
  document.getElementById('sheetOverlay').classList.add('on');
  document.getElementById('sheet').classList.add('on');
  renderSidebar();
}

function closeSheet(){
  document.getElementById('sheetOverlay').classList.remove('on');
  document.getElementById('sheet').classList.remove('on');
  pendingAct=null;
}

// ── SIDEBAR / ACTIVITY LIST ────────────────────
function renderSidebar(){
  const list=document.getElementById('acList');list.innerHTML='';
  const acts=curFilter==='all'?allActs():curFilter==='custom'?customActs:allActs().filter(a=>a.type===curFilter);
  if(!acts.length){list.innerHTML='<div style="text-align:center;padding:20px;color:var(--muted);font-size:12px">No activities here</div>';return;}
  acts.forEach(a=>{
    const used=isUsed(a.id);
    const closed=isClosed(a.id,curDay);
    const div=document.createElement('div');
    div.className=`ac${a.isCustom?' custom-card':''}${used?' used':''}`;
    const cp=a.cost===0?`<span class="pill pf">Free</span>`:`<span class="pill pc">~$${a.cost}/p</span>`;
    const cl=closed?`<div class="ac-closed">⚠ Closed ${DAYS.find(d=>d.id===curDay)?.name} — pick another day</div>`:(a.cl&&a.cl.length?`<div class="ac-closed">⚠ Closed: ${a.cl.map(d=>DAYS.find(x=>x.id===d)?.name||d).join(', ')}</div>`:'');
    const badge=a.isCustom?`<span class="pill" style="background:var(--mint-l);color:var(--ocean-d)">✦${a.createdBy==='nicole'?'Nicole':'Lacey'}</span>`:'';
    const delBtn=a.isCustom?`<button class="ac-del" data-del="${a.id}" title="Delete">✕</button>`:'';
    div.innerHTML=`
      <div class="ac-left">
        <div class="ac-name">${a.e} ${a.name}</div>
        <div class="ac-meta">${cp}<span class="pill pt">~${a.dur*30}min</span>${badge}</div>
        ${cl}
      </div>
      ${!used&&!closed?`<button class="ac-add" data-aid="${a.id}">＋</button>`:''}
      ${delBtn}
    `;
    if(!used&&!closed){
      div.querySelector('.ac-add').addEventListener('click',e=>{
        e.stopPropagation();
        selectActivityToPlace(a.id);
      });
    }
    if(a.isCustom){
      const de=div.querySelector('[data-del]');
      if(de) de.addEventListener('click',e=>{e.stopPropagation();deleteCustom(a.id);});
    }
    list.appendChild(div);
  });
}

// ── SELECT ACTIVITY → SHOW TIME PICKER ────────
function selectActivityToPlace(aid){
  const a=getA(aid);if(!a)return;
  closeSheet();
  pendingAct=aid;
  openTpicker(aid);
}

// ── TIME PICKER ───────────────────────────────
function openTpicker(aid){
  const a=getA(aid);
  const dayName=DAYS.find(d=>d.id===curDay)?.name;
  document.getElementById('tp-title').textContent=`${a.e} ${a.name}`;
  document.getElementById('tp-sub').textContent=`Pick a start time on ${dayName} · ~${a.dur*30} min`;

  const grid=document.getElementById('tp-grid');
  grid.innerHTML='';
  for(let s=0;s<TOTAL;s++){
    const btn=document.createElement('div');
    btn.className='tp-slot';
    btn.textContent=t2s(s);

    // Check if slot is taken or would overflow
    const wouldConflict=isConflict(curDay,s,a.dur);
    const wouldOverflow=s+a.dur>TOTAL;
    if(wouldConflict||wouldOverflow){
      btn.classList.add('taken');
    } else {
      btn.addEventListener('click',()=>{
        closeTpicker();
        placeAct(curDay,s,aid);
      });
    }
    grid.appendChild(btn);
  }
  document.getElementById('tpicker').style.display='flex';
}

function closeTpicker(){
  document.getElementById('tpicker').style.display='none';
  pendingAct=null;
}

// ── PLACE ─────────────────────────────────────
function placeAct(did,s,aid){
  const a=getA(aid);if(!a)return;
  if(isUsed(aid)){toast(`${a.name} already placed!`,'te');return;}
  if(isClosed(aid,did)){toast(`⚠ ${a.name} CLOSED on ${DAYS.find(d=>d.id===did)?.name}!`,'te',3500);return;}
  if(s+a.dur>TOTAL){toast('Not enough time — try earlier.','tw');return;}
  if(isConflict(did,s,a.dur)){toast(`⚠ Conflict at ${t2s(s)}!`,'tw');return;}
  for(let i=s;i<s+a.dur;i++) placed[did][i]={actId:aid,isStart:i===s,span:a.dur,who:currentWho};
  pendingAct=null;
  toast(`${a.e} ${a.name} added to ${DAYS.find(d=>d.id===did)?.name}!`,'ts',1800);
  renderAll();saveToBin();
}

// ── REMOVE ────────────────────────────────────
function removeAct(did,s,aid,span){
  for(let i=s;i<s+span;i++) delete placed[did][i];
  toast('Removed','tw',1300);renderAll();saveToBin();
}

// ── CUSTOM ────────────────────────────────────
function openModal(){document.getElementById('modal').style.display='flex';setTimeout(()=>document.getElementById('m-name').focus(),80);}
function closeModal(){document.getElementById('modal').style.display='none';['m-name','m-emoji','m-cost','m-note'].forEach(id=>document.getElementById(id).value='');document.getElementById('m-dur').value='2';document.getElementById('m-closed').value='';}

function submitCustom(){
  const name=document.getElementById('m-name').value.trim();
  if(!name){toast('Name is required!','te');return;}
  const emoji=document.getElementById('m-emoji').value.trim()||'📌';
  const dur=parseInt(document.getElementById('m-dur').value)||2;
  const cost=parseFloat(document.getElementById('m-cost').value)||0;
  const closedVal=document.getElementById('m-closed').value;
  const cl=closedVal?[closedVal]:[];
  const note=document.getElementById('m-note').value.trim();
  customActs.push({id:'custom-'+Date.now(),e:emoji,name,type:'custom',dur,cost,cl,n:note||'Custom activity',createdBy:currentWho,isCustom:true});
  closeModal();
  toast(`✦ "${name}" added!`,'ts');
  renderAll();saveToBin();
}

function deleteCustom(id){
  customActs=customActs.filter(a=>a.id!==id);
  DAYS.forEach(d=>{Object.keys(placed[d.id]).forEach(s=>{if(placed[d.id][s]?.actId===id) delete placed[d.id][s];});});
  toast('Custom activity removed','tw');renderAll();saveToBin();
}

// ── FILTER TABS ───────────────────────────────
document.getElementById('ftabs').addEventListener('click',e=>{
  const tab=e.target.closest('.ftab');if(!tab)return;
  document.querySelectorAll('.ftab').forEach(t=>t.classList.remove('on'));
  tab.classList.add('on');curFilter=tab.dataset.f;renderSidebar();
});

// ── INIT ──────────────────────────────────────
setSS('busy','Loading...');
loadFromBin().then(()=>{renderAll();startPolling();setSS('ok');});

// ── COUNTDOWN ─────────────────────────────────
(function(){
  const target = new Date('2026-07-22T00:00:00-05:00'); // CDT
  function tick(){
    const now = new Date();
    const diff = target - now;
    if(diff <= 0){
      document.getElementById('cdUnits').innerHTML = '<span class="cd-done">🌊 WE'RE HERE!! 🐚</span>';
      return;
    }
    const d = Math.floor(diff/864e5);
    const h = Math.floor((diff%864e5)/36e5);
    const m = Math.floor((diff%36e5)/6e4);
    const s = Math.floor((diff%6e4)/1e3);
    document.getElementById('cdDays').textContent = String(d).padStart(2,'0');
    document.getElementById('cdHrs').textContent  = String(h).padStart(2,'0');
    document.getElementById('cdMins').textContent = String(m).padStart(2,'0');
    document.getElementById('cdSecs').textContent = String(s).padStart(2,'0');
  }
  tick();
  setInterval(tick, 1000);
})();

</script>
